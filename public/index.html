<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#121214">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="세션매니저">
  <meta name="application-name" content="세션매니저">
  <title>N100 Session Manager</title>
  <link rel="manifest" href="/manifest.json?v=20261020_v20">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg?v=20261020_v20">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png?v=20261020_v20">
  <link rel="apple-touch-icon" href="/icons/icon-192.png?v=20261020_v20">
  <link rel="stylesheet" href="/vendor/katex/katex.min.css">
  <link rel="stylesheet" href="/mobile.css?v=20261026_v29">
</head>
<body>
  <div id="app">
    <!-- Top Header -->
    <header id="header">
      <button id="btn-drawer-toggle" class="icon-btn" aria-label="세션 목록 열기">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <div id="header-info">
        <h1 id="current-session-title">세션을 선택하세요</h1>
        <div id="current-session-meta">
          <span id="current-session-badge" class="badge">Offline</span>
          <span id="current-session-subtitle"></span>
        </div>
      </div>
      <div id="header-actions">
        <button id="btn-fullscreen" class="header-action-btn" type="button" title="전체화면 전환">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
          </svg>
          <span class="btn-text">전체화면</span>
        </button>
        <a id="btn-google-web" class="header-action-btn" href="#" target="_blank" rel="noopener noreferrer" title="antigravity.google.com 웹 콘솔 열기" style="display:none;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span class="btn-text">Web</span>
        </a>
        <button id="btn-refresh" class="icon-btn" aria-label="새로고침" title="새로고침">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- In-chat Search Bar (Reveals on Scroll-Up) -->
    <div id="chat-search-bar" class="chat-search-bar" aria-label="대화 내용 검색">
      <div class="search-bar-inner">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="chat-search-input" placeholder="대화 내용 검색..." autocomplete="off">
        <span id="chat-search-count" class="search-count" style="display: none;">0/0</span>
        <div id="chat-search-nav" class="search-nav" style="display: none;">
          <button id="btn-search-prev" class="search-nav-btn" type="button" aria-label="이전 검색 결과">▲</button>
          <button id="btn-search-next" class="search-nav-btn" type="button" aria-label="다음 검색 결과">▼</button>
        </div>
        <button id="btn-search-close" class="search-close-btn" type="button" aria-label="검색 닫기">✕</button>
      </div>
    </div>

    <!-- Slide-out Drawer for Sessions -->
    <div id="drawer-backdrop"></div>
    <aside id="drawer">
      <div id="drawer-header">
        <div class="drawer-title-group">
          <h2>N100 세션 목록</h2>
          <span id="session-count-badge" class="count-badge">0</span>
        </div>
        <button id="btn-drawer-close" class="icon-btn" aria-label="닫기">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div id="drawer-search">
        <input type="text" id="session-search" placeholder="세션 검색..." autocomplete="off">
      </div>
      <div id="drawer-install-banner" class="drawer-install-banner" style="display:none;">
        <button id="btn-drawer-install-pwa" class="drawer-install-btn" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          홈 화면에 웹앱으로 설치하기
        </button>
      </div>
      <div id="drawer-content">
        <div id="session-list">
          <div class="loading-spinner">세션 불러오는 중...</div>
        </div>
      </div>
    </aside>

    <!-- Main Chat Container -->
    <main id="chat-container">
      <div id="empty-state">
        <div class="empty-icon">💬</div>
        <h3>선택된 세션이 없습니다</h3>
        <p>상단 메뉴(☰)를 눌러 대화할 세션을 선택하세요.</p>
        <button id="btn-open-drawer-action" class="primary-btn">세션 목록 열기</button>
      </div>
      <div id="chat-history"></div>
    </main>

    <!-- Pull to Refresh Indicator -->
    <div id="pull-refresh-indicator" class="pull-refresh-indicator">
      <div class="pull-refresh-spinner"></div>
      <span class="pull-refresh-text">당겨서 새로고침</span>
    </div>

    <!-- Scroll to bottom button -->
    <button id="btn-scroll-bottom" class="floating-btn" aria-label="맨 아래로">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <polyline points="19 12 12 19 5 12"></polyline>
      </svg>
    </button>

    <!-- Bottom Composer -->
    <footer id="composer">
      <!-- Queued Messages (대기 중인 프롬프트) -->
      <div id="queued-messages-container" style="display: none;"></div>

      <!-- Attachment Previews -->
      <div id="attachment-preview-bar" class="attachment-preview-bar" style="display: none;"></div>

      <div class="composer-box">
        <!-- Voice Recording Mini Bar (녹음 진행 중일 때 노출) -->
        <div id="voice-recording-bar" class="voice-recording-bar" style="display: none;">
          <div class="voice-rec-left">
            <svg class="voice-rec-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
              <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
            </svg>
            <span class="voice-rec-text">Recording...</span>
          </div>
          <div class="voice-rec-right">
            <span id="voice-rec-timer" class="voice-rec-timer">0:00</span>
            <button id="btn-voice-stop" class="voice-btn-stop" type="button" aria-label="녹음 완료">
              <span class="voice-stop-square"></span>
            </button>
            <button id="btn-voice-cancel" class="voice-btn-cancel" type="button" aria-label="녹음 취소">✕</button>
          </div>
        </div>

        <textarea id="composer-input" rows="1" placeholder="Ask anything, @ to mention, / for actions" autocomplete="off"></textarea>

        <div class="composer-toolbar">
          <div class="toolbar-left">
            <input type="file" id="file-picker" multiple style="display: none;">
            <button id="btn-attach" class="attach-btn" type="button" aria-label="파일 첨부">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </button>
            <button id="btn-model-picker" class="model-picker-chip" type="button" aria-label="모델 선택">
              <span id="model-picker-name" class="model-name-text">Gemini 3.8 Flash High</span>
              <svg class="model-gauge-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f9ab00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2a10 10 0 0 0-10 10c0 4.4 2.9 8.2 7 9.5"/>
                <path d="M22 12A10 10 0 0 0 12 2"/>
                <path d="M12 12l5-5"/>
                <circle cx="12" cy="12" r="2" fill="#f9ab00"/>
              </svg>
              <svg class="model-caret-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="18 15 12 9 6 15"></polyline>
              </svg>
            </button>
          </div>

          <div class="toolbar-right">
            <button id="btn-voice" class="voice-btn" type="button" aria-label="음성 입력">
              <svg class="voice-idle-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="23"></line>
                <line x1="8" y1="23" x2="16" y2="23"></line>
              </svg>
              <div class="voice-dots-anim">
                <span></span><span></span><span></span>
              </div>
            </button>
            <button id="btn-send" class="send-btn" aria-label="전송" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </footer>

    <!-- Code Review / Diff Modal Sheet -->
    <div id="review-modal-backdrop" class="modal-backdrop"></div>
    <div id="review-modal" class="review-modal">
      <div class="review-modal-header">
        <div class="review-modal-title-area">
          <div class="review-modal-title">코드 변경 사항 (Review)</div>
          <div id="review-modal-subtitle" class="review-modal-subtitle">변경 내역을 확인하는 중...</div>
        </div>
        <div class="review-modal-actions">
          <a id="btn-review-web-link" href="#" target="_blank" rel="noopener noreferrer" class="review-web-link" style="display:none;" title="웹 콘솔에서 열기">
            🌐 Web
          </a>
          <button id="btn-close-review" class="icon-btn close-modal-btn" type="button" aria-label="닫기">
            ✕
          </button>
        </div>
      </div>
      <div id="review-modal-body" class="review-modal-body">
        <div class="loading-spinner">변경 사항을 불러오는 중...</div>
      </div>
    </div>

    <!-- Model Picker Bottom Sheet Modal -->
    <div id="model-picker-backdrop" class="modal-backdrop"></div>
    <div id="model-picker-sheet" class="model-picker-sheet">
      <div class="sheet-drag-handle"></div>
      <div class="model-sheet-header">
        <span class="model-sheet-title">Model</span>
      </div>

      <!-- Reasoning Effort Selection (Low / Mid / High) -->
      <div class="effort-control-bar">
        <span class="effort-control-title">Reasoning Effort</span>
        <div class="effort-segmented-control" id="model-effort-group">
          <button type="button" class="effort-btn" data-effort="low">Low</button>
          <button type="button" class="effort-btn" data-effort="mid">Mid</button>
          <button type="button" class="effort-btn active" data-effort="high">High</button>
        </div>
      </div>

      <div id="model-sheet-list" class="model-sheet-list">
        <!-- Javascript dynamically renders available models -->
      </div>
      <div class="model-sheet-divider"></div>
      <div id="btn-view-usage" class="model-sheet-usage-btn">
        <div class="usage-label-wrap">
          <svg class="usage-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a10 10 0 0 0-10 10c0 4.4 2.9 8.2 7 9.5"/>
            <path d="M22 12A10 10 0 0 0 12 2"/>
            <path d="M12 12l5-5"/>
            <circle cx="12" cy="12" r="2" fill="currentColor"/>
          </svg>
          <span class="usage-text">View Usage</span>
        </div>
        <svg class="usage-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </div>
    </div>

    <!-- Usage & Quotas Bottom Sheet Modal -->
    <div id="usage-modal-backdrop" class="modal-backdrop"></div>
    <div id="usage-modal-sheet" class="usage-modal-sheet">
      <div class="sheet-drag-handle"></div>
      <div class="usage-sheet-header">
        <div class="usage-header-title-wrap">
          <svg class="usage-header-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f9ab00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a10 10 0 0 0-10 10c0 4.4 2.9 8.2 7 9.5"/>
            <path d="M22 12A10 10 0 0 0 12 2"/>
            <path d="M12 12l5-5"/>
            <circle cx="12" cy="12" r="2" fill="#f9ab00"/>
          </svg>
          <span class="usage-sheet-title">Plan Usage &amp; Quotas</span>
        </div>
        <button id="btn-close-usage" class="icon-btn close-modal-btn" type="button" aria-label="닫기">✕</button>
      </div>
      <div id="usage-sheet-content" class="usage-sheet-content">
        <div class="loading-spinner">사용량 데이터를 불러오는 중...</div>
      </div>
    </div>
  </div>

  <script src="/vendor/purify.min.js"></script>
  <script src="/vendor/katex/katex.min.js"></script>
  <script src="/marked.umd.js"></script>
  <script src="/mobile.js?v=20261026_v34"></script>
</body>
</html>
