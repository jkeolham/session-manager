<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#121214">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="세션매니저">
  <meta name="application-name" content="세션매니저">
  <title>N100 Session Manager</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/mobile.css?v=20261020_v13">
</head>
<body>
  <div id="app">
    <!-- Top Header -->
    <header id="header">
      <button id="btn-drawer-toggle" class="icon-btn" aria-label="세션 목록 열기">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <div id="header-info">
        <h1 id="current-session-title">세션을 선택하세요</h1>
        <div id="current-session-meta">
          <span id="current-session-badge" class="badge">Offline</span>
          <span id="current-session-subtitle"></span>
        </div>
      </div>
      <div id="header-actions">
        <button id="btn-fullscreen" class="header-action-btn" type="button" title="전체화면 전환">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
          </svg>
          <span class="btn-text">전체화면</span>
        </button>
        <a id="btn-google-web" class="header-action-btn" href="#" target="_blank" rel="noopener noreferrer" title="antigravity.google.com 웹 콘솔 열기" style="display:none;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span class="btn-text">Web</span>
        </a>
        <button id="btn-refresh" class="icon-btn" aria-label="새로고침" title="새로고침">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Slide-out Drawer for Sessions -->
    <div id="drawer-backdrop"></div>
    <aside id="drawer">
      <div id="drawer-header">
        <div class="drawer-title-group">
          <h2>N100 세션 목록</h2>
          <span id="session-count-badge" class="count-badge">0</span>
        </div>
        <button id="btn-drawer-close" class="icon-btn" aria-label="닫기">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div id="drawer-search">
        <input type="text" id="session-search" placeholder="세션 검색..." autocomplete="off">
      </div>
      <div id="drawer-install-banner" class="drawer-install-banner" style="display:none;">
        <button id="btn-drawer-install-pwa" class="drawer-install-btn" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          홈 화면에 웹앱으로 설치하기
        </button>
      </div>
      <div id="drawer-content">
        <div id="session-list">
          <div class="loading-spinner">세션 불러오는 중...</div>
        </div>
      </div>
    </aside>

    <!-- Main Chat Container -->
    <main id="chat-container">
      <div id="empty-state">
        <div class="empty-icon">💬</div>
        <h3>선택된 세션이 없습니다</h3>
        <p>상단 메뉴(☰)를 눌러 대화할 세션을 선택하세요.</p>
        <button id="btn-open-drawer-action" class="primary-btn">세션 목록 열기</button>
      </div>
      <div id="chat-history"></div>
    </main>

    <!-- Pull to Refresh Indicator -->
    <div id="pull-refresh-indicator" class="pull-refresh-indicator">
      <div class="pull-refresh-spinner"></div>
      <span class="pull-refresh-text">당겨서 새로고침</span>
    </div>

    <!-- Scroll to bottom button -->
    <button id="btn-scroll-bottom" class="floating-btn" aria-label="맨 아래로">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </button>

    <!-- Bottom Composer -->
    <footer id="composer">
      <!-- Attachment Previews -->
      <div id="attachment-preview-bar" class="attachment-preview-bar" style="display: none;"></div>

      <div class="composer-box">
        <input type="file" id="file-picker" multiple style="display: none;">
        <button id="btn-attach" class="attach-btn" type="button" aria-label="파일 첨부">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
          </svg>
        </button>
        <textarea id="composer-input" rows="1" placeholder="메시지 입력... (Enter=전송, Shift+Enter=줄바꿈)" autocomplete="off"></textarea>
        <button id="btn-send" class="send-btn" aria-label="전송" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </footer>

    <!-- Code Review / Diff Modal Sheet -->
    <div id="review-modal-backdrop" class="modal-backdrop"></div>
    <div id="review-modal" class="review-modal">
      <div class="review-modal-header">
        <div class="review-modal-title-area">
          <div class="review-modal-title">코드 변경 사항 (Review)</div>
          <div id="review-modal-subtitle" class="review-modal-subtitle">변경 내역을 확인하는 중...</div>
        </div>
        <div class="review-modal-actions">
          <a id="btn-review-web-link" href="#" target="_blank" rel="noopener noreferrer" class="review-web-link" style="display:none;" title="웹 콘솔에서 열기">
            🌐 Web
          </a>
          <button id="btn-close-review" class="icon-btn close-modal-btn" type="button" aria-label="닫기">
            ✕
          </button>
        </div>
      </div>
      <div id="review-modal-body" class="review-modal-body">
        <div class="loading-spinner">변경 사항을 불러오는 중...</div>
      </div>
    </div>
  </div>

  <script src="/mobile.js?v=20261020_v13"></script>
</body>
</html>
